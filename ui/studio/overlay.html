<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Studio · 透明叠加层</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/ui/studio/overlay.css?v=1.0.2"></head>
<body><main id="overlay" class="layout-corner" aria-label="比赛数据叠加层">
  <section id="status" class="plate"><span id="connection-dot"></span><b id="mode">等待数据</b><span id="map-name">地图</span><strong id="match-time">--:--</strong><span>已识别 <b id="identified">0</b></span></section>
  <section id="minimap" class="plate" aria-label="态势地图"><iframe title="实时小地图" src="/?overlay-map=1" tabindex="-1"></iframe></section>
  <section id="alert" hidden><div class="alert-icon"><img src="/ui/studio/assets/alert-hud.svg" alt=""></div><div><h1 id="alert-title"></h1><p><span id="alert-direction"></span> <strong id="alert-distance"></strong></p></div><div id="alert-progress"></div></section>
  <section id="radar" aria-label="相对方位雷达"><canvas width="240" height="240"></canvas><span id="radar-range"></span></section>
  <section id="threats" class="plate"><header><b>附近对手</b><span id="threat-count"></span><strong id="near-count"></strong></header><div id="threat-list"></div></section>
  <section id="observer" class="plate"><div class="observer-avatar" id="observer-initial">—</div><div class="observer-body"><h2 id="observer-name">等待观察对象</h2><p id="observer-meta">暂无可用坐标</p></div><strong id="observer-hp">--<small>HP</small></strong><div class="health-track"><i id="health-bar"></i></div></section>
  <section id="ticker" class="plate"><b>接近提醒</b><div id="event-list">等待距离变化…</div></section>
</main><script type="module" src="/ui/studio/overlay.js?v=1.0.2"></script></body></html>
